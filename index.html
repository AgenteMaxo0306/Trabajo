<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de cámara</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    video {
      width: 100%;
      height: 72vh;
      object-fit: cover;
      background: black;
      display: none;
    }
    button {
      padding: 15px 22px;
      margin: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }
    #abrir { background: #55e6c1; }
    #cerrar { background: white; display: none; }
    #estado { padding: 15px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>Prueba de cámara del celular</h2>
  <p>Presioná el botón y aceptá el permiso.</p>

  <video id="video" autoplay playsinline muted></video>
  <div>
    <button id="abrir">ABRIR CÁMARA</button>
    <button id="cerrar">CERRAR CÁMARA</button>
  </div>
  <p id="estado">Esperando para iniciar...</p>

  <script>
    const video = document.getElementById("video");
    const estado = document.getElementById("estado");
    const abrir = document.getElementById("abrir");
    const cerrar = document.getElementById("cerrar");
    let flujo = null;

    abrir.onclick = async () => {
      estado.textContent = "Solicitando acceso a la cámara...";

      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "El navegador no permite acceder a la cámara aquí. " +
            "Abrí la página mediante HTTPS."
          );
        }

        flujo = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        });

        video.srcObject = flujo;
        video.style.display = "block";
        await video.play();

        abrir.style.display = "none";
        cerrar.style.display = "inline-block";
        estado.textContent = "¡Cámara funcionando correctamente!";

      } catch (e) {
        estado.textContent =
          "Error: " + e.name + " — " + e.message +
          ". Revisá el permiso de cámara y probá en HTTPS.";
      }
    };

    cerrar.onclick = () => {
      if (flujo) {
        flujo.getTracks().forEach(pista => pista.stop());
        flujo = null;
      }
      video.srcObject = null;
      video.style.display = "none";
      cerrar.style.display = "none";
      abrir.style.display = "inline-block";
      estado.textContent = "Cámara cerrada.";
    };
  </script>
</body>
</html>
